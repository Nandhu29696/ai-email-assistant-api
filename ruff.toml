# Lint gate used by CI: real errors only (syntax, undefined names, unused imports/variables).
target-version = "py311"
extend-exclude = ["venv", "alembic/versions"]

[lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[lint.per-file-ignores]
"tests/*" = ["F841"]
"app/models/__init__.py" = ["F401"]
"app/schemas/__init__.py" = ["F401"]
"app/services/__init__.py" = ["F401"]
